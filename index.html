<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d6b5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>控制點選點</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 全螢幕地圖，頂部狀態列，底部抽屜面板（新增／點位資料／通視編輯／清單／圖層與資料） */
:root{
  --bg:#f1f3ef; --surface:#ffffff; --fg:#17211c; --muted:#5b6861; --line:#d3dad4;
  --accent:#0d6b5b; --accent-fg:#ffffff; --sight:#e8590c; --danger:#c22a2a; --halo:rgba(13,107,91,.18);
  --known:#7a3fb5; --ok:#1f8a3b; --root:#a8641a;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101612; --surface:#19211c; --fg:#e6ece7; --muted:#9aa8a0; --line:#2c3831;
  --accent:#3fc4a8; --accent-fg:#06211b; --sight:#ff922b; --danger:#ff7a7a; --halo:rgba(63,196,168,.22);
  --known:#b98cf0; --ok:#4fd36e; --root:#e3a85d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101612; --surface:#19211c; --fg:#e6ece7; --muted:#9aa8a0; --line:#2c3831;
  --accent:#3fc4a8; --accent-fg:#06211b; --sight:#ff922b; --danger:#ff7a7a; --halo:rgba(63,196,168,.22);
  --known:#b98cf0; --ok:#4fd36e; --root:#e3a85d; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

#map{position:fixed;inset:0;z-index:0;background:#cfd6d1}
#map.nobase{background:var(--bg)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 82%,transparent)!important;color:var(--muted)!important;font-size:10px}
.leaflet-control-attribution a{color:inherit!important}

/* markers */
.pinwrap{background:none;border:0}
.pin{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;transform:translate(-22px,-22px);pointer-events:none}
.pin i{pointer-events:auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.pin i::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--accent);border:2.5px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.45)}
.pin span{pointer-events:none;background:color-mix(in srgb,var(--surface) 92%,transparent);color:var(--fg);font-size:12px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.pin span{margin-left:-8px}
.pin.kn i::after{border-radius:3px;background:var(--known);width:13px;height:13px;transform:rotate(45deg)}
.pin.kn span{color:var(--known)}
.pin.kn.rt i::after{background:var(--root);border-radius:2px;transform:none;width:13px;height:13px}
.pin.kn.rt span{color:var(--root)}
.pin.sel i{background:var(--halo)}
.pin.sel i::after{background:var(--sight);width:18px;height:18px}
.pin.cand i::after{background:#fff;border-color:var(--sight)}
.pin.lk i::after{background:var(--sight)}
.pin.mv i{background:rgba(232,89,12,.28);outline:2px dashed var(--sight)}
.pin,.pin *{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.pin.kn.rt.off i::after{background:#9aa0a6;border-color:#e5e7eb}
.pin.kn.rt.off span{color:#8a9097;opacity:.85}

/* top bar */
.top{position:fixed;z-index:1100;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 14px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:15px;line-height:1.2}
.brand small{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0}
.brand small span+span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:#2fb344}.dot.bad{background:var(--danger)}.dot.wait{background:#f0a400}
.chip{min-height:40px;max-width:44vw;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.seg{align-self:flex-start;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.seg button{min-height:36px;padding:0 10px;border:0;border-radius:7px;background:none;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}

/* map layer toggles */
.mapbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tg{min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:14px;font-weight:500;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.tg[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);font-weight:700}
.tg[aria-pressed="true"]::before{content:"✓ "}
@media(max-width:430px){.mapbar{gap:6px}.tg{padding:0 8px;font-size:13px}.tg[aria-pressed="true"]::before{content:"✓"}}
.leaflet-tooltip.dist-tip{background:var(--surface);color:var(--fg);border:1px solid #2563eb;border-radius:6px;box-shadow:none;font:700 12px var(--mono);padding:1px 6px}
.leaflet-tooltip.dist-tip::before{display:none}
.leaflet-tooltip.dist-tip.near{border-color:var(--sight)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--fg)}
.leaflet-popup-content{margin:10px 14px;font-size:14px;line-height:1.6}
.leaflet-popup-content b{font-family:var(--mono)}

/* fabs */
.fabs{position:fixed;z-index:1100;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);display:flex;flex-direction:column;gap:10px}
.round{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.22)}
.round svg{width:22px;height:22px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#locBtn.trk{background:#2563eb;border-color:#2563eb}#locBtn.trk svg{stroke:#fff}
#locBtn.busy svg{animation:locspin 1s linear infinite}#locBtn:disabled{opacity:.75}
@keyframes locspin{to{transform:rotate(360deg)}}
.hd-ic{pointer-events:none}.hd-ic svg{width:96px;height:96px;display:block}
#addBtn{position:fixed;z-index:1100;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);min-height:54px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-fg);font-size:17px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3)}
body.has-sheet .fabs,body.has-sheet #addBtn{display:none}
@media (max-height:640px){.fabs{gap:6px}.round{width:42px;height:42px}}

/* crosshair */
#cross{position:fixed;z-index:1050;left:50%;top:35%;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:none}
#cross svg{width:100%;height:100%;stroke:var(--sight);stroke-width:2.5;fill:none;filter:drop-shadow(0 0 2px #fff)}

/* sheet */
#sheet{position:fixed;z-index:1200;left:0;right:0;bottom:0;max-height:64vh;overflow-y:auto;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.28);padding:6px 16px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:12px}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);align-self:center;flex:none}
.head{display:flex;gap:8px;align-items:center}
.head h2{margin:0;font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1;flex:none}
.mini{min-height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:700;flex:none}
.in{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;font-size:16px;min-width:0}
textarea.in{min-height:64px;padding:10px 12px;resize:vertical}
.mono{font-family:var(--mono);font-size:13px;color:var(--fg);overflow-wrap:anywhere;line-height:1.7}
.mono small{color:var(--muted);font-family:var(--font);font-size:12px}
.label{font-size:12px;color:var(--muted);letter-spacing:.06em;margin-bottom:4px;display:block}
.btn.nav{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--fg)}
.cgrid{display:flex;flex-wrap:wrap;gap:10px}
.cbtn{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);padding:0;flex:none}
.cbtn[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--surface) inset}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:15px}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sight{background:var(--sight);border-color:var(--sight);color:#fff}
.btn.dng{color:var(--danger)}
.btn.dngfill{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.on{background:var(--sight);border-color:var(--sight);color:#fff}
.btn[disabled]{opacity:.55}
.hint{margin:0;font-size:14px;color:var(--muted);line-height:1.6}
.meta{font-size:12px;color:var(--muted);line-height:1.7}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list li{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;min-height:46px}
.list li{flex:none}
#sheet{-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
#sheet>*{flex:none}
.list li.pe{display:block}
.list li+li{border-top:1px solid var(--line)}
.list .nm{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .d{font-family:var(--mono);font-size:13px;color:var(--muted)}
.list button.rm{min-height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:13px;color:var(--danger)}
.list button.go{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:44px;border:0;background:none;text-align:left;padding:0}
.empty{padding:14px;color:var(--muted);font-size:14px}
.prow{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ok2{color:var(--ok);font-size:14px;font-weight:600}
.bad2{color:var(--danger);font-size:14px;font-weight:600;line-height:1.6}
.swatch{display:inline-block;width:18px;height:3px;background:var(--linec,#1d6fe0);vertical-align:middle;margin-right:6px;border-radius:2px}
.card2{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.seg2{display:flex;gap:6px}
.seg2 button{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:15px}
.seg2 button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.numrow{display:flex;gap:8px}
.numrow .seg2{flex:0 0 auto}
.numrow .seg2 button{min-width:56px;flex:none}
.numrow .in{flex:1;font-family:var(--mono);font-weight:600;font-size:18px;text-align:center}
.msg{font-size:13px;line-height:1.5;min-height:20px;color:var(--muted)}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--danger)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two .in{font-family:var(--mono)}
.row{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer}
.row input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.row span{flex:1;min-width:0;line-height:1.45}
.grp{display:flex;flex-direction:column;gap:8px;padding-top:4px}
details.grp>summary{cursor:pointer;color:var(--muted);font-size:13px;min-height:36px;display:flex;align-items:center}
/* 詳細面板：兩欄列、收合 */
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.r2>.btn{min-width:0}
.r2 select.in{min-height:48px}
#sheet .grab{width:60px;height:5px;margin:2px 0 4px;position:relative}
#sheet .grab::before{content:"";position:absolute;left:-30px;right:-30px;top:-10px;bottom:-10px}
#sheet.dt .grab,#sheet.dt .head,#sheet .minbar{touch-action:none}
.minbar{display:none;align-items:center;gap:8px;min-height:44px}
.minbar .nm{font-size:17px;font-weight:700;white-space:nowrap}
.minbar .inf{flex:1;min-width:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet.min{gap:4px}
#sheet.min>*:not(.grab):not(.minbar){display:none}
#sheet.min>.minbar{display:flex}
ol.steps{margin:0;padding-left:20px;line-height:1.8;font-size:14px}

/* toast + modal */
#toast{position:fixed;z-index:1400;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 112px);margin:auto;max-width:420px;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.5;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.modal{position:fixed;z-index:1300;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;overflow-y:auto}
.card{width:100%;max-width:400px;background:var(--surface);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.card h1{margin:0;font-size:20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="map"></div>
<div id="cross" hidden><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="9"/><path d="M22 2v10M22 32v10M2 22h10M32 22h10"/></svg></div>

<div class="top">
  <div class="bar">
    <div class="brand"><b>控制點選點</b><small><span class="dot" id="dot"></span><span id="stat">尚未進入專案</span></small></div>
    <button class="chip" id="whoBtn" aria-label="姓名與專案">登入</button>
  </div>
  <div class="mapbar">
    <div class="seg" role="group" aria-label="底圖">
      <button type="button" data-b="emap" aria-pressed="true">電子</button>
      <button type="button" data-b="photo" aria-pressed="false">正射</button>
      <button type="button" data-b="none" aria-pressed="false">無底圖</button>
    </div>
    <button class="tg" type="button" data-ly="sect" aria-pressed="true">段籍圖</button>
    <button class="tg" type="button" data-ly="cad" aria-pressed="true">地籍圖</button>
  </div>
</div>

<div class="fabs">
  <button class="round" id="srchBtn" aria-label="搜尋點位"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 5 5"/></svg></button>
  <button class="round" id="fitBtn" aria-label="全範圍"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="round" id="layBtn" aria-label="圖層與資料"><svg viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></button>
  <button class="round" id="listBtn" aria-label="點位清單"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg></button>
  <button class="round" id="progBtn" aria-label="工作進度"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M8.5 12l2 2 4-4M8.5 17h7"/></svg></button>
  <button class="round" id="locBtn" aria-label="我的位置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
</div>
<button id="addBtn">＋ 新增點位</button>

<section id="sheet" hidden></section>
<div id="toast" role="status"></div>
<input type="file" id="fileIn" hidden>

<div id="login" class="modal" hidden>
  <form class="card" id="loginForm">
    <h1>姓名與專案</h1>
    <p class="hint">姓名會記錄在你新增和修改的點位上。輸入專案密碼進入專案，密碼請只給組員。已登入、只想改姓名時，密碼可留空。</p>
    <div><label class="label" for="nameIn">你的姓名</label><input class="in" id="nameIn" maxlength="20" autocomplete="off" placeholder="例如：王小明" required></div>
    <div><label class="label" for="pwIn">專案密碼</label><input class="in" id="pwIn" maxlength="40" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="例如：abcd-efgh-jkmn-pqrs"></div>
    <div class="btns">
      <button class="btn pri" type="submit">進入專案</button>
      <button class="btn" type="button" id="copyLink">複製分享連結</button>
    </div>
    <button class="btn" type="button" id="loginCancel" hidden>取消</button>
  </form>
</div>

<div id="info" class="modal" hidden>
  <div class="card">
    <h1 id="infoTitle"></h1>
    <div id="infoBody"></div>
    <button class="btn pri" id="infoOk" type="button">知道了</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

/* ---- TWD97 TM2（121°E 二度分帶，EPSG:3826）---- */
const TM={a:6378137,f:1/298.257222101,k0:0.9999,lon0:121,FE:250000};
const TMc=(()=>{
  const n=TM.f/(2-TM.f),n2=n*n,n3=n2*n,n4=n3*n;
  return{n,A:TM.a/(1+n)*(1+n2/4+n4/64+n3*n3/256),
    al:[n/2-2*n2/3+5*n3/16+41*n4/180,13*n2/48-3*n3/5+557*n4/1440,61*n3/240-103*n4/140,49561*n4/161280],
    be:[n/2-2*n2/3+37*n3/96-n4/360,n2/48+n3/15-437*n4/1440,17*n3/480-37*n4/840,4397*n4/161280],
    de:[2*n-2*n2/3-2*n3+116*n4/45,7*n2/3-8*n3/5-227*n4/45,56*n3/15-136*n4/35,4279*n4/630]};
})();
const RAD=Math.PI/180;
function toTM2(lat,lng){
  const {n,A,al}=TMc,p=lat*RAD,l=(lng-TM.lon0)*RAD,c=2*Math.sqrt(n)/(1+n);
  const t=Math.sinh(Math.atanh(Math.sin(p))-c*Math.atanh(c*Math.sin(p)));
  const x0=Math.atan2(t,Math.cos(l)),e0=Math.atanh(Math.sin(l)/Math.sqrt(1+t*t));
  let xi=x0,eta=e0;
  for(let j=1;j<=4;j++){xi+=al[j-1]*Math.sin(2*j*x0)*Math.cosh(2*j*e0);eta+=al[j-1]*Math.cos(2*j*x0)*Math.sinh(2*j*e0)}
  return{N:TM.k0*A*xi,E:TM.FE+TM.k0*A*eta};
}
function fromTM2(N,E){
  const {A,be,de}=TMc,xi=N/(TM.k0*A),eta=(E-TM.FE)/(TM.k0*A);
  let x0=xi,e0=eta;
  for(let j=1;j<=4;j++){x0-=be[j-1]*Math.sin(2*j*xi)*Math.cosh(2*j*eta);e0-=be[j-1]*Math.cos(2*j*xi)*Math.sinh(2*j*eta)}
  const chi=Math.asin(Math.sin(x0)/Math.cosh(e0));
  let lat=chi;for(let j=1;j<=4;j++)lat+=de[j-1]*Math.sin(2*j*chi);
  return{lat:lat/RAD,lng:TM.lon0+Math.atan2(Math.sinh(e0),Math.cos(x0))/RAD};
}
function inTaiwan(lat,lng){return lat>=21.5&&lat<=26.5&&lng>=119.5&&lng<=122.5}

function parseCoords(txt){
  return String(txt||'').trim().replace(/,\s+/g,',').split(/\s+/).map(s=>{const q=s.split(',');return[parseFloat(q[1]),parseFloat(q[0])]}).filter(c=>isFinite(c[0])&&isFinite(c[1]));
}
function parseKml(text){
  if(/^PK/.test(text))return{error:'kmz'};
  const doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.getElementsByTagName('parsererror').length)return{error:'xml'};
  const points=[],lines=[],cs=doc.getElementsByTagNameNS('*','coordinates');
  for(let i=0;i<cs.length;i++){
    const el=cs[i],kind=el.parentNode&&el.parentNode.localName,pm=el.closest('Placemark');
    let name='';
    if(pm){for(const ch of pm.children){if(ch.localName==='name'){name=(ch.textContent||'').trim();break}}}
    const c=parseCoords(el.textContent);
    if(kind==='Point'){if(c.length)points.push({name,lat:c[0][0],lng:c[0][1]})}
    else if((kind==='LineString'||kind==='LinearRing')&&c.length>=2)lines.push({name,coords:c});
  }
  return{points,lines};
}
/* 地籍圖用：不建 DOM，直接抓座標（檔案大時較省記憶體） */
function parseKmlLines(text){
  if(/^PK/.test(text))return{error:'kmz'};
  const re=/<(?:\w+:)?coordinates[^>]*>([\s\S]*?)<\/(?:\w+:)?coordinates>/g,rings=[];let m;
  while((m=re.exec(text))){const c=parseCoords(m[1].replace(/<!\[CDATA\[|\]\]>/g,''));if(c.length>=2)rings.push(c)}
  return{rings};
}

const csvEsc=v=>{const s=v==null?'':String(v);return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};

const DEF_MARK='鋼標'; /* 新增點位與匯入時，樁標空白一律預設鋼標 */
function calcProgress(pts,linkedIds){
  const linked=linkedIds instanceof Set?linkedIds:new Set(linkedIds||[]);
  const out={total:pts.length,marks:{'鋼標':0,'道釘':0,'其他':0,'未設定':0},BI:{count:0,max:0,used:[],missing:[]},HI:{count:0,max:0,used:[],missing:[]},other:[],noMark:[],noLink:[],noNote:[]};
  pts.forEach(p=>{
    const m=CSV_MARKS.includes(p.mark)?p.mark:'未設定';out.marks[m]++;
    const pn=parseName(p.name);
    if(pn){const g=out[pn.p];g.count++;g.used.push(pn.n);if(pn.n>g.max)g.max=pn.n}else out.other.push(p.name);
    if(m==='未設定')out.noMark.push(p);
    if(!linked.has(p.id))out.noLink.push(p);
    if(m==='其他'&&!String(p.note||'').trim())out.noNote.push(p);
  });
  ['BI','HI'].forEach(k=>{const g=out[k],set=new Set(g.used);for(let i=1;i<=g.max;i++)if(!set.has(i))g.missing.push(i);g.used.sort((x,y)=>x-y)});
  const byName=(x,y)=>nameCmp(x.name,y.name);out.noMark.sort(byName);out.noLink.sort(byName);out.noNote.sort(byName);
  return out;
}
function buildCsv(pts,opt){
  const sorted=pts.slice().sort((a,b)=>nameCmp(a.name,b.name));
  const rows=[];
  if(opt.header)rows.push(['點名','N','E','樁標種類'].concat(opt.extra?['緯度','經度','精度(m)','建立者','最後修改者']:[]));
  sorted.forEach(p=>{
    const t=toTM2(p.lat,p.lng),r=[p.name,t.N.toFixed(3),t.E.toFixed(3),p.mark||''];
    if(opt.extra)r.push(p.lat.toFixed(8),p.lng.toFixed(8),p.acc!=null?Math.round(p.acc):'',p.by||'',p.editedBy||p.by||'');
    rows.push(r);
  });
  if(opt.stats!==false){
    const pr=calcProgress(sorted,new Set());
    rows.push([]);
    rows.push(['鋼標',pr.marks['鋼標']],['道釘',pr.marks['道釘']],['其他',pr.marks['其他']],['未設定',pr.marks['未設定']]);
    rows.push(['BI開頭',pr.BI.count],['HI開頭',pr.HI.count]);
    if(pr.other.length)rows.push(['其他(共點)',pr.other.length]);
    rows.push(['總計',pr.total]);
    sorted.forEach(p=>{if(String(p.note||'').trim())rows.push(['備註',p.name,String(p.note).trim()])});
  }
  const w=4+(opt.extra?5:0);
  return '﻿'+rows.map(r=>{const q=r.slice();while(q.length<w)q.push('');return q.map(csvEsc).join(',')}).join('\r\n')+'\r\n';
}
const xmlEsc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
function distM(a,b){const p=toTM2(a.lat,a.lng),q=toTM2(b.lat,b.lng);return Math.hypot(p.N-q.N,p.E-q.E)}
function kmlColor(hex){const h=String(hex||'#1d6fe0').replace('#','');return 'ff'+h.slice(4,6)+h.slice(2,4)+h.slice(0,2)}
function buildLinesKml(lineList,title,colorHex){
  const items=lineList.map(l=>({label:l.a.name+'-'+l.b.name,a:l.a,b:l.b})).sort((x,y)=>nameCmp(x.label,y.label));
  return '<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document>\n<name>'+xmlEsc(title)+'</name>\n'+
    '<Style id="sight"><LineStyle><color>'+kmlColor(colorHex)+'</color><width>3</width></LineStyle></Style>\n'+
    items.map(i=>'<Placemark><name>'+xmlEsc(i.label)+'</name><description>距離 '+distM(i.a,i.b).toFixed(2)+' m</description><styleUrl>#sight</styleUrl><LineString><tessellate>1</tessellate><coordinates>'+
      i.a.lng.toFixed(8)+','+i.a.lat.toFixed(8)+',0 '+i.b.lng.toFixed(8)+','+i.b.lat.toFixed(8)+',0</coordinates></LineString></Placemark>').join('\n')+'\n</Document></kml>\n';
}
/* ---- 匯入 CSV（與匯出格式相同：點名、N、E、樁標種類，可含緯度、經度、統計列、備註列） ---- */
function parseCsvRows(text){
  const s=String(text||'').replace(/^﻿/,''),rows=[];let row=[],cur='',q=false;
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(q){if(c==='"'){if(s[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&s[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.map(r=>r.map(v=>v.trim()));
}
function parseCsvPoints(text){
  const rows=parseCsvRows(text);
  let col={name:0,N:1,E:2,mark:3,lat:-1,lng:-1};
  const map=new Map(),notes=new Map();let bad=0,hasNote=false;
  rows.forEach(r=>{
    if(!r.some(v=>v!==''))return;
    if(r[0]==='點名'){
      const f=k=>r.indexOf(k);
      col={name:0,N:f('N'),E:f('E'),mark:f('樁標種類'),lat:f('緯度'),lng:f('經度')};
      return;
    }
    const name=r[0],N=parseFloat(r[col.N]),E=parseFloat(r[col.E]);
    if(name&&isFinite(N)&&isFinite(E)&&col.N>=0&&col.E>=0){
      let lat=col.lat>=0?parseFloat(r[col.lat]):NaN,lng=col.lng>=0?parseFloat(r[col.lng]):NaN;
      if(!(isFinite(lat)&&isFinite(lng)&&inTaiwan(lat,lng))){const g=fromTM2(N,E);lat=g.lat;lng=g.lng}
      if(!inTaiwan(lat,lng)){bad++;return}
      const mk=col.mark>=0?r[col.mark]:'';
      map.set(name.toUpperCase(),{name,lat,lng,mark:mk===''?DEF_MARK:CSV_MARKS.includes(mk)?mk:''});
      return;
    }
    if(r[0]==='備註'&&r[1]){hasNote=true;notes.set(r[1].toUpperCase(),r[2]||'');return}
  });
  const points=[...map.values()];
  points.forEach(p=>{p.note=notes.get(p.name.toUpperCase())||''});
  return{points,bad,hasNote};
}
/* ---- 匯入通視線：KML 線的兩端對回點位（先比座標 tol 公尺內最近點，再用線名「A-B」拆點名） ---- */
function matchLines(kmlLines,pts,tol){
  const P=pts.map(p=>Object.assign({},p,toTM2(p.lat,p.lng))),byName=new Map();
  P.forEach(p=>{const k=String(p.name||'').trim().toUpperCase();if(k&&!byName.has(k))byName.set(k,p.id)});
  const near=c=>{const t=toTM2(c[0],c[1]);let best=null,bd=tol;P.forEach(p=>{const d=Math.hypot(p.N-t.N,p.E-t.E);if(d<=bd){bd=d;best=p.id}});return best};
  const byLabel=lab=>{const s=String(lab||'').trim().toUpperCase();for(let i=s.indexOf('-');i>0;i=s.indexOf('-',i+1)){const a=byName.get(s.slice(0,i).trim()),b=byName.get(s.slice(i+1).trim());if(a&&b)return[a,b]}return null};
  const pairs=[],missing=[];
  kmlLines.forEach(l=>{
    const c=l.coords;let a=near(c[0]),b=near(c[c.length-1]);
    if(!a||!b||a===b){const q=byLabel(l.name);if(q){a=q[0];b=q[1]}}
    if(a&&b&&a!==b)pairs.push({a,b,name:l.name});else missing.push(l.name||'（無名稱）');
  });
  return{pairs,missing};
}

async function resolveProject(pw){

/* ---------- drawing ---------- */
function pinCls(id){
  const c=['pin'];
  if(isK(id))c.push('kn');
  if(isRoot(id))c.push('rt');
  if(isOff(id))c.push('off');
  if(dragId===id)c.push('mv','sel');
  else if(sel===id)c.push('sel');
  else if(mode==='link'&&sel)c.push(lines.has(lineKey(sel,id))?'lk':'cand');
  return c.join(' ');
}
function upsertMarker(id,p){
  const cls=pinCls(id),sig=cls+'|'+p.name;
  let m=markers.get(id);
  if(!m){
    m=L.marker([p.lat,p.lng],{icon:L.divIcon({className:'pinwrap',iconSize:[0,0],html:'<div class="'+cls+'" data-id="'+esc(id)+'"><i></i><span>'+esc(p.name)+'</span></div>'}),keyboard:false,draggable:false,interactive:false});
    m._sig=sig;
    m.addTo(map);markers.set(id,m);
  }else{
    const ll=m.getLatLng();
    if(Math.abs(ll.lat-p.lat)>1e-10||Math.abs(ll.lng-p.lng)>1e-10)m.setLatLng([p.lat,p.lng]);
    if(m._sig!==sig){
      /* 只改樣式與文字，不整塊換掉（iOS 手指按住時元素被換掉會收不到放開事件） */
      const el=m.getElement(),pin=el&&el.querySelector('.pin'),sp=pin&&pin.querySelector('span');
      if(pin&&sp){pin.className=cls;if(sp.textContent!==p.name)sp.textContent=p.name}
      else m.setIcon(L.divIcon({className:'pinwrap',iconSize:[0,0],html:'<div class="'+cls+'" data-id="'+esc(id)+'"><i></i><span>'+esc(p.name)+'</span></div>'}));
      m._sig=sig;
    }
  }
}
function draw(){
  points.forEach((p,id)=>upsertMarker(id,p));
  known.forEach((p,id)=>{if(lyOn(id))upsertMarker(id,p)});
  markers.forEach((m,id)=>{
    const keep=isK(id)?(known.has(id)&&lyOn(id)):points.has(id);
    if(!keep){map.removeLayer(m);markers.delete(id)}
  });
  const sight=lineColor;
  const rmPoly=k=>{const o=polys.get(k);if(o){map.removeLayer(o.v);map.removeLayer(o.h);polys.delete(k)}};
  lines.forEach((l,k)=>{
    const a=getPt(l.a),b=getPt(l.b);
    if(!a||!b){rmPoly(k);return}
    const ll=[[a.lat,a.lng],[b.lat,b.lng]];
    const o=polys.get(k);
    if(!o){
      const v=L.polyline(ll,{color:sight,weight:3,opacity:.95,interactive:false}).addTo(map);
      const h=L.polyline(ll,{color:sight,weight:(window.L&&L.Browser&&L.Browser.mobile)?32:24,opacity:0,interactive:false}).addTo(map);
      polys.set(k,{v,h});
    }else{o.v.setLatLngs(ll);o.h.setLatLngs(ll)}
    const o2=polys.get(k);if(o2&&o2.v.setStyle)o2.v.setStyle({weight:selLine===k?7:3});
  });
  [...polys.keys()].forEach(k=>{if(!lines.has(k))rmPoly(k)});
  setStatus();
  if(mode==='line'&&!lines.has(selLine)){closeAll();return}
  if(mode==='move'&&pendMove&&!points.has(pendMove.id)){pendMove=null;dragId=null;clearMvLayers();toast('這個點已被其他人刪除');closeAll();return}
  if(pendingSel&&points.has(pendingSel)){const id=pendingSel;pendingSel=null;select(id);return}
  if(mode==='detail'||mode==='link'){if(!getPt(sel)){closeAll();return}refreshDetail()}
  else if(mode==='list'){if(!posId)renderList()}
  else if(mode==='progress')renderProgress();
  else if(mode==='add'){const r=$('#addEd .ed');if(r)edCheck(r)}
  updateNear();
}

/* ---------- GPS ---------- */
async function getFix(){
  if(!window.isSecureContext||!navigator.geolocation)throw {kind:'unsupported'};
  let state='unknown';
  try{state=(await navigator.permissions.query({name:'geolocation'})).state}catch(e){}
  if(state==='denied')throw {kind:'denied'};
  if(state==='prompt')toast('接下來手機會詢問是否允許位置，請選「允許」');
  return new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(p=>res(p.coords),
    err=>rej({kind:err.code===1?'denied':err.code===3?'timeout':'unavailable'}),
    {enableHighAccuracy:true,timeout:25000,maximumAge:0}));
}
function gpsProblem(e){
  const kind=e&&e.kind;
  if(kind==='denied'){
    const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
    showInfo('需要允許位置權限', ios
      ?'<ol class="steps"><li>開啟手機「設定」→「隱私權與安全性」→「定位服務」，確認已開啟。</li><li>在同一頁往下找到「Safari 網站」，選「使用 App 期間」。</li><li>回到網頁，點網址列左側的「aA」→「網站設定」→「位置」→「允許」。</li><li>重新整理頁面，再按一次定位。</li></ol>'
      :'<ol class="steps"><li>點網址列左側的圖示（鎖頭或調整圖示）→「權限」→「位置」→「允許」。</li><li>重新整理頁面，再按一次定位。</li><li>若仍失敗，到手機「設定」→「位置」確認定位已開啟，並選擇高精確度。</li></ol>');
  }else if(kind==='unsupported')showInfo('無法使用定位','<p class="hint">這個瀏覽器或網址不支援定位。請用 Chrome 或 Safari 開啟 https 網址。你仍可以移動地圖，讓十字對準位置來新增點位。</p>');
  else if(kind==='timeout')toast('定位逾時，請到空曠處再試一次');
  else toast('暫時無法取得位置，請確認手機定位已開啟');
}
let locGuard=0;
function clearLoc(){locLayers.forEach(l=>map.removeLayer(l));locLayers=[]}
function showMe(c,fit){
  clearLoc();locGuard=Date.now()+1500;
  const me0={lat:c.latitude,lng:c.longitude},ll=[c.latitude,c.longitude];
  locLayers.push(L.circle(ll,{radius:Math.max(c.accuracy||5,3),color:'#2563eb',weight:1,fillColor:'#2563eb',fillOpacity:.15,interactive:false}).addTo(map));
  locLayers.push(L.circleMarker(ll,{radius:6,color:'#ffffff',weight:2,fillColor:'#2563eb',fillOpacity:1,interactive:false}).addTo(map));
  const cand=[];
  points.forEach(p=>cand.push({p,d:distM(me0,p)}));
  known.forEach(p=>{if(lyOn(p.id)&&!isOff(p.id))cand.push({p,d:distM(me0,p)})});
  cand.sort((a,b)=>a.d-b.d);
  let near=cand.filter(x=>x.d<=200),far=false;
  if(!near.length&&cand.length){near=[cand[0]];far=true}
  near.forEach(x=>{
    const pl=L.polyline([ll,[x.p.lat,x.p.lng]],{color:'#2563eb',weight:2,dashArray:'6 6',interactive:false}).addTo(map);
    pl.bindTooltip(fmtDist(x.d),{permanent:true,direction:'center',className:'dist-tip'});
    locLayers.push(pl);
  });
  if(fit&&near.length&&!far)map.fitBounds(L.latLngBounds([ll].concat(near.map(x=>[x.p.lat,x.p.lng]))).pad(.25),{maxZoom:19});
  if(hdMk)hdMk.setLatLng(ll);
  return{near,far};
}
function nearTxt(r){
  if(!r.near.length)return '專案裡還沒有點位可比對。';
  const x=r.near[0],nm=x.p.name+(isK(x.p.id)?'（'+catName(x.p.id)+'）':'');
  if(r.far)return '200 m 內沒有點位，最近的是 '+nm+'，距離 '+fmtDist(x.d)+'。';
  return '200 m 內有 '+r.near.length+' 個點位，最近的是 '+nm+'，距離 '+fmtDist(x.d)+'。';
}
/* 持續追蹤（再按一次或 5 分鐘自動停止）＋方向扇形（羅盤） */
let trk=null,hdMk=null,hdOn=false;
const locBtn=()=>$('#locBtn');
function locBtnState(st){const b=locBtn();b.classList.toggle('busy',st==='busy');b.classList.toggle('trk',st==='trk');b.disabled=st==='busy';b.setAttribute('aria-pressed',st==='trk'?'true':'false')}
function askHeading(){
  // iOS（含 iPad Chrome）需在按鈕事件內同步呼叫 requestPermission
  const D=window.DeviceOrientationEvent;
  if(D&&typeof D.requestPermission==='function'){try{D.requestPermission().then(r=>{if(r==='granted')hdListen();else toast('未允許方向權限，不顯示方向扇形')}).catch(()=>{})}catch(e){}}
  else hdListen();
}
function hdListen(){
  if(hdOn)return;hdOn=true;
  if('ondeviceorientationabsolute' in window)window.addEventListener('deviceorientationabsolute',onHd);
  else window.addEventListener('deviceorientation',onHd);
}
function hdUnlisten(){hdOn=false;window.removeEventListener('deviceorientationabsolute',onHd);window.removeEventListener('deviceorientation',onHd)}
function onHd(e){
  let h=null;
  if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;
  else if(e.alpha!=null&&(e.absolute||e.type==='deviceorientationabsolute'))h=360-e.alpha;
  if(h==null||!trk||!hdMk)return;
  const so=(screen.orientation&&typeof screen.orientation.angle==='number')?screen.orientation.angle:(window.orientation||0);
  h=((h+so)%360+360)%360;
  const el=hdMk.getElement(),sv=el&&el.querySelector('svg');
  if(sv){sv.style.transform='rotate('+h.toFixed(1)+'deg)';el.style.visibility='visible'}
}
function hdMarker(ll){
  if(!map.getPane('hdPane')){const pn=map.createPane('hdPane');pn.style.zIndex=399;pn.style.pointerEvents='none'}
  hdMk=L.marker(ll,{pane:'hdPane',interactive:false,keyboard:false,icon:L.divIcon({className:'hd-ic',iconSize:[96,96],iconAnchor:[48,48],
    html:'<svg viewBox="-48 -48 96 96"><defs><radialGradient id="hdg" cx="0" cy="0" r="46" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2563eb" stop-opacity=".55"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient></defs><path d="M0 0L-23 -39.8A46 46 0 0 1 23 -39.8Z" fill="url(#hdg)"/></svg>'})}).addTo(map);
  const el=hdMk.getElement();if(el)el.style.visibility='hidden';
}
function startTrack(){
  if(!window.isSecureContext||!navigator.geolocation){gpsProblem({kind:'unsupported'});return}
  askHeading();
  locBtnState('busy');
  const t={wid:null,timer:null,first:true};trk=t;
  (async()=>{
    let state='unknown';
    try{state=(await navigator.permissions.query({name:'geolocation'})).state}catch(e){}
    if(trk!==t)return;
    if(state==='denied'){stopTrack();gpsProblem({kind:'denied'});return}
    if(state==='prompt')toast('接下來手機會詢問是否允許位置，請選「允許」');
    t.wid=navigator.geolocation.watchPosition(p=>onTrack(t,p.coords),err=>{
      if(trk!==t)return;
      const kind=err.code===1?'denied':err.code===3?'timeout':'unavailable';
      if(t.first||kind==='denied'){stopTrack();gpsProblem({kind})}
    },{enableHighAccuracy:true,timeout:25000,maximumAge:0});
    t.timer=setTimeout(()=>{if(trk===t){stopTrack();toast('已追蹤 5 分鐘，自動停止定位')}},300000);
  })();
}
function onTrack(t,c){
  if(trk!==t)return;
  if(!hdMk)hdMarker([c.latitude,c.longitude]);
  if(t.first){
    t.first=false;locBtnState('trk');
    const r=showMe(c,true);
    if(!r.near.length||r.far)map.setView([c.latitude,c.longitude],Math.max(map.getZoom(),18));
    toast('持續定位中（再按一次停止），精度約 ±'+Math.round(c.accuracy)+' m。'+nearTxt(r));
  }else showMe(c,false);
}
function stopTrack(){
  const t=trk;trk=null;
  if(t){if(t.wid!=null)navigator.geolocation.clearWatch(t.wid);clearTimeout(t.timer)}
  hdUnlisten();if(hdMk){map.removeLayer(hdMk);hdMk=null}
  clearLoc();locBtnState('');
}
function crossLL(){
  const cr=$('#cross').getBoundingClientRect(),r=map.getContainer().getBoundingClientRect();
  return map.containerPointToLatLng(L.point(cr.left+cr.width/2-r.left,cr.top+cr.height/2-r.top));
}
/* 新增點位：十字到 300 m 內最近 4 個點的橘色虛線與距離（新設點＋顯示中的加密點、圖根） */
const NEAR_R=300,NEAR_N=4;let nearLayers=[];
function clearNear(){nearLayers.forEach(l=>map.removeLayer(l));nearLayers=[]}
function updateNear(){
  if(mode!=='add'){if(nearLayers.length)clearNear();return}
  const c=crossLL(),kx=111320*Math.cos(c.lat*RAD),cand=[];
  const take=p=>{const dx=(p.lng-c.lng)*kx,dy=(p.lat-c.lat)*111320;if(Math.abs(dx)>NEAR_R*1.05||Math.abs(dy)>NEAR_R*1.05)return;const d=distM(c,p);if(d<=NEAR_R)cand.push({p,d})};
  points.forEach(take);
  known.forEach(p=>{if(lyOn(p.id)&&!isOff(p.id))take(p)});
  cand.sort((a,b)=>a.d-b.d);
  const near=cand.slice(0,NEAR_N);
  while(nearLayers.length>near.length)map.removeLayer(nearLayers.pop());
  near.forEach((x,i)=>{
    const ll=[[c.lat,c.lng],[x.p.lat,x.p.lng]];
    let pl=nearLayers[i];
    if(!pl){pl=L.polyline(ll,{color:'#e8590c',weight:2,dashArray:'6 6',interactive:false}).addTo(map);pl.bindTooltip('',{permanent:true,direction:'center',className:'dist-tip near'});nearLayers[i]=pl}
    else pl.setLatLngs(ll);
    pl.setTooltipContent(fmtDist(x.d));
    const tp=pl.getTooltip();if(tp)tp.setLatLng([(c.lat+x.p.lat)/2,(c.lng+x.p.lng)/2]);
  });
}
map.on('move zoom',updateNear);
function viewAtCross(lat,lng,z){
  map.setView([lat,lng],z,{animate:false});
  const cr=$('#cross').getBoundingClientRect(),r=map.getContainer().getBoundingClientRect(),sz=map.getSize();
  map.panBy(L.point(-(cr.left+cr.width/2-r.left-sz.x/2),-(cr.top+cr.height/2-r.top-sz.y/2)),{animate:false});
}
function focusPt(p){
  const s=map.getSize(),cur=map.latLngToContainerPoint([p.lat,p.lng]);
  map.panBy(cur.subtract(L.point(s.x/2,s.y*0.2)),{animate:true});
}

async function createPoint(name,data){
  const pid=doc(colRef('points')).id;
  await runTransaction(fs,async t=>{
    const nref=docRef('names',nameKey(name)),s=await t.get(nref);
    if(s.exists())throw {code:'dup'};
    t.set(nref,{pid,at:Date.now()});
    t.set(docRef('points',pid),data);
  });
  return pid;
}
async function renamePoint(pid,newName){
  const old=points.get(pid).name;
  await runTransaction(fs,async t=>{
    const nref=docRef('names',nameKey(newName)),oref=docRef('names',nameKey(old));
    const ns=await t.get(nref),os=await t.get(oref);
    if(ns.exists()&&ns.data().pid!==pid)throw {code:'dup'};
    t.set(nref,{pid,at:Date.now()});
    if(os.exists()&&os.data().pid===pid&&nameKey(old)!==nameKey(newName))t.delete(oref);
    t.update(docRef('points',pid),{name:newName,editedBy:me,editedAt:Date.now()});
  });
}
function txFail(err){
  if(err&&err.code==='dup')toast('這個點號剛被別人使用，請改用下一個號碼');
  else toast('需要網路連線才能確認點號不重複，請稍後再試');
}

function goFound(id,rad){

  showLyOf(id);
  const dl=rad/111320,dn=rad/(111320*Math.cos(p.lat*Math.PI/180));
  map.fitBounds(L.latLngBounds([[p.lat-dl,p.lng-dn],[p.lat+dl,p.lng+dn]]),{animate:false,maxZoom:20});

function doSearch(){
  const q=($('#srName').value||'').trim().toUpperCase(),msg=$('#srMsg'),res=$('#srRes');
  let rad=parseFloat($('#srRad').value);if(!(rad>0))rad=200;rad=Math.min(rad,5000);
  res.innerHTML='';
  if(!q){msg.textContent='請輸入點號';msg.className='msg bad';return}
  const hits=[];
  points.forEach((p,id)=>{if(String(p.name).toUpperCase().includes(q))hits.push({id,name:p.name,t:'新設'})});
  known.forEach((p,id)=>{if(p.cat!=='root'&&String(p.name).toUpperCase().includes(q))hits.push({id,name:p.name,t:'加密'})});
  const ex=hits.filter(h=>h.name.toUpperCase()===q);
  if(ex.length===1||hits.length===1){goFound((ex[0]||hits[0]).id,rad);return}
  if(!hits.length){msg.textContent='找不到符合「'+q+'」的新設點或加密點';msg.className='msg bad';return}
  hits.sort((a,b)=>nameCmp(a.name,b.name));
  msg.textContent='符合 '+hits.length+' 個，請選一個'+(hits.length>40?'（只列前 40 個，請輸入更完整的點號）':'');msg.className='msg ok';

    const miss=g.missing.length?'<div class="bad2">缺號：'+g.missing.map(n=>nm(k,n)).join('、')+'</div>':'<div class="ok2">無跳號 ✓</div>';
    return '<li class="pe"><div class="prow"><b>'+k+'</b><span>共 '+g.count+' 點，最大 '+nm(k,g.max)+'</span></div>'+miss+'</li>';

async function importLines(text){

  if(r.error==='kmz'){setImpMsg('這是 KMZ 壓縮檔，請先解壓縮，用裡面的 .kml 檔匯入。');return}
  if(r.error){setImpMsg('檔案無法解析，請確認是 KML 格式。');return}
  if(!r.lines.length){setImpMsg('檔案裡沒有線段（需要 Placemark 的 LineString）。');return}
  if(!navigator.onLine){setImpMsg('目前沒有網路，無法匯入。');return}
  const pts=[];points.forEach((p,id)=>pts.push({id,name:p.name,lat:p.lat,lng:p.lng}));known.forEach((p,id)=>pts.push({id,name:p.name,lat:p.lat,lng:p.lng}));
  const m=matchLines(r.lines,pts,0.5),seen=new Set(),now=Date.now();let dup=0;
  const ops=[];
  m.pairs.forEach(q=>{const k=lineKey(q.a,q.b);if(lines.has(k)||seen.has(k)){dup++;return}seen.add(k);ops.push(b=>b.set(docRef('lines',k),{a:q.a,b:q.b,by:me,at:now}))});
  busy=true;setImpMsg('匯入通視線中…');
  try{
    await commitChunks(ops,400);
    const miss=m.missing;
    setImpMsg('已匯入 '+ops.length+' 條通視線'+(dup?'，'+dup+' 條已存在略過':'')+(miss.length?'；'+miss.length+' 條找不到對應點位，未匯入：'+miss.slice(0,30).join('、')+(miss.length>30?' 等':''):'')+'。');
  }catch(err){setImpMsg('匯入失敗，請確認網路與資料庫規則後再試。')}
  finally{busy=false}
  draw();
}

async function commitChunks(ops,size){
  for(let i=0;i<ops.length;i+=size){
    const b=writeBatch(fs);

    await b.commit();

async function importFile(kind,file){
  setImpMsg('讀取檔案中…');
  let text;
  try{text=await file.text()}catch(e){setImpMsg('無法讀取這個檔案');return}
  await new Promise(r=>setTimeout(r,30));
  if(kind==='cad'){
    setImpMsg('解析地籍圖中，檔案大時需要一點時間…');
    await new Promise(r=>setTimeout(r,30));
    const r=parseKmlLines(text);
    if(r.error==='kmz'){setImpMsg('這是 KMZ 壓縮檔，請先解壓縮，用裡面的 .kml 檔匯入。');return}
    if(!r.rings.length){setImpMsg('檔案裡沒有找到線段座標，請確認是地籍圖的 KML。');return}
    try{await idb.set('cad',{name:file.name,rings:r.rings})}catch(e){setImpMsg('已載入，但無法存到這支手機，下次開啟需要重新匯入。')}
    ly.cad=true;store.set('cp_ly2_cad','1');syncTg();setCad(r.rings,file.name);
    if(cadLayer)map.fitBounds(cadLayer.getBounds());
    setImpMsg('地籍圖已載入：'+r.rings.length.toLocaleString()+' 條線。');
    if(mode==='layers')renderLayers();
    return;
  }
  if(kind==='ks'){
    setImpMsg('解析已知點通視中…');
    await new Promise(r=>setTimeout(r,30));
    const r=parseKmlLines(text);
    if(r.error==='kmz'){setImpMsg('這是 KMZ 壓縮檔，請先解壓縮，用裡面的 .kml 檔匯入。');return}
    if(!r.rings.length){setImpMsg('檔案裡沒有找到線段座標，請確認是通視線的 KML。');return}
    try{await idb.set('ks',{name:file.name,rings:r.rings})}catch(e){setImpMsg('已載入，但無法存到這支手機，下次開啟需要重新匯入。')}
    ly.ks=true;store.set('cp_ly_ks','1');setKs(r.rings,file.name);
    if(ksLayer)map.fitBounds(ksLayer.getBounds());
    setImpMsg('已知點通視已載入：'+r.rings.length.toLocaleString()+' 條線。');
    if(mode==='layers')renderLayers();
    return;
  }
  if(needProject())return;
  if(kind==='lines'){importLines(text);return}
  if(kind==='new'&&(/\.csv$/i.test(file.name)||!/^(\uFEFF)?\s*(<|PK)/.test(text))){prepCsv(text);return}
  const r=parseKml(text);
  if(r.error==='kmz'){setImpMsg('這是 KMZ 壓縮檔，請先解壓縮，用裡面的 .kml 檔匯入。');return}
  if(r.error){setImpMsg('檔案無法解析，請確認是 KML 格式。');return}
  if(!r.points.length){setImpMsg('檔案裡沒有點位（需要 Placemark 的 Point）。');return}
  if(!navigator.onLine){setImpMsg('目前沒有網路，無法匯入。');return}
  busy=true;
  try{
    const now=Date.now();
    if(kind==='known'||kind==='root'){
      const isR=kind==='root',cn=isR?'歷年圖根':'加密點';
      const seen=new Map();
      r.points.forEach(p=>{if(p.name)seen.set(p.name,p)});
      const ops=[...seen.values()].map(p=>b=>b.set(docRef('known',(isR?'k_%R_':'k_')+encodeURIComponent(p.name)),Object.assign({name:p.name,lat:p.lat,lng:p.lng,by:me,at:now},isR?{cat:'root'}:{})));
      setImpMsg('匯入'+cn+'中…');
      await commitChunks(ops,400);
      const skipped=r.points.length-seen.size;
      setImpMsg('已匯入 '+seen.size+' 個'+cn+(skipped?'（'+skipped+' 個沒有名稱或名稱重複，已略過）':'')+'。');
      if(isR){ly.root=true;store.set('cp_ly_root','1')}else{ly.known=true;store.set('cp_ly_known','1')}
      if(seen.size&&!fitted){const f=[...seen.values()][0];map.setView([f.lat,f.lng],17)}
    }else{
      const names=new Set(allNames().map(s=>String(s).trim().toUpperCase())),add=[];let skip=0;
      r.points.forEach(p=>{
        const u=p.name.trim().toUpperCase();
        if(!u||names.has(u)){skip++;return}
        names.add(u);add.push(p);
      });
      const ops=add.map(p=>b=>{
        const pid=doc(colRef('points')).id;
        b.set(docRef('points',pid),{name:p.name.trim(),lat:p.lat,lng:p.lng,acc:null,src:'import',mark:DEF_MARK,note:'',by:me,at:now,editedBy:me,editedAt:now});
        b.set(docRef('names',nameKey(p.name)),{pid,at:now});
      });
      setImpMsg('匯入新設點中…');
      await commitChunks(ops,200);
      setImpMsg('已匯入 '+add.length+' 個新設點'+(skip?'（'+skip+' 個點號已存在或沒有名稱，已略過）':'')+'。');
    }
  }catch(err){setImpMsg('匯入失敗，請確認網路與資料庫規則後再試。')}
  finally{busy=false}
  draw();
}

    case 'moveNo':closeAll();break;
    case 'srGo':doSearch();break;
    case 'rename':openRename();break;
    case 'collapse':setMin(true);break;
    case 'expand':setMin(false);break;
    case 'renameApply':applyRename();break;
    case 'copyTM':{const p=getPt(t.dataset.id||sel);if(p)navigator.clipboard.writeText(tmText(p)).then(()=>toast('已複製 N,E')).catch(()=>toast('無法複製，請直接長按座標選取'));break}
    case 'posApply':applyPos();break;
    case 'link':enterLink();break;
    case 'linkDone':select(sel);break;
    case 'del':confirmDel=true;fillDetail(false);break;
    case 'delNo':confirmDel=false;fillDetail(false);break;
    case 'delYes':deletePoint();break;
    case 'lineDel':confirmLineDel=true;renderLineSheet();break;
    case 'lineDelNo':confirmLineDel=false;renderLineSheet();break;
    case 'lineDelYes':{const k=selLine;closeAll();if(k)fire(deleteDoc(docRef('lines',k)));toast('已刪除通視線');break}
    case 'expCsv':exportCsv();break;
    case 'csvYes':doCsv();break;
    case 'csvNo':pendCsv=null;setImpMsg('已取消 CSV 匯入。');renderLayers();break;
    case 'expKml':exportKml();break;
    case 'clrCad':
      if(armed!=='cad'){armed='cad';t.textContent='再按一次確定清除';setTimeout(()=>{if(armed==='cad'){armed=null;t.textContent='清除本機地籍圖'}},4000)}
      else{armed=null;t.textContent='清除本機地籍圖';idb.del('cad');setCad(null);setImpMsg('已清除這支手機上的地籍圖。');renderLayers()}
      break;
    case 'clrKnown':case 'clrRoot':{
      const cat=t.dataset.act==='clrRoot'?'root':'known',lab=cat==='root'?'刪除全部歷年圖根':'刪除全部加密點';
      if(armed!==cat){armed=cat;t.textContent='再按一次確定刪除（全組員都會消失）';setTimeout(()=>{if(armed===cat){armed=null;t.textContent=lab}},4000)}
      else{armed=null;t.textContent=lab;clearKnown(cat)}
      break}
    case 'clrKS':
      if(armed!=='ks'){armed='ks';t.textContent='再按一次確定清除';setTimeout(()=>{if(armed==='ks'){armed=null;t.textContent='清除本機已知點通視'}},4000)}
      else{armed=null;t.textContent='清除本機已知點通視';idb.del('ks');setKs(null);setImpMsg('已清除這支手機上的已知點通視。');renderLayers()}
      break;
  }
});
sheet.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.ly){
    ly[el.dataset.ly]=el.checked;store.set('cp_ly_'+el.dataset.ly,el.checked?'1':'0');
    if(el.dataset.ly==='sect')applySect();
    if(el.dataset.ly==='cad')applyCad();
    if(el.dataset.ly==='ks')applyKs();
    if(el.dataset.ly==='known'||el.dataset.ly==='root')draw();
    return;
  }
  if(el.id==='csvHead'){csvOpt.header=el.checked;return}
  if(el.id==='csvExtra'){csvOpt.extra=el.checked;return}
  if(el.id==='csvStats'){csvOpt.stats=el.checked;return}
  if(el.id==='fMark'){const p=points.get(sel);if(!p)return;const nb=$('#noteBox');if(nb)nb.hidden=(el.value!=='其他');if(el.value!==(p.mark||''))savePoint({mark:el.value});return}
  if(el.id==='fStat'){if(!isRoot(sel))return;const sb=$('#stNoteBox');if(sb)sb.hidden=!el.value;const r=rstat.get(sel);saveRootStat(el.value,el.value?((r&&r.note)||($('#fStNote')&&$('#fStNote').value.trim())||''):'');toast(el.value?'已標記為「'+ST_NAME[el.value]+'」，地圖上改成灰色':'已改回正常');return}
  if(el.id==='fStNote'){if(!isRoot(sel))return;const st=rootSt(sel);if(st){const v=el.value.trim(),r=rstat.get(sel);if(v!==((r&&r.note)||''))saveRootStat(st,v)}return}
  if(el.id==='fNote'){const p=points.get(sel);if(!p)return;const v=el.value.trim();if(v!==(p.note||''))savePoint({note:v})}
});
sheet.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='srName'){e.preventDefault();doSearch();return}
  if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='checkbox')e.target.blur()});
$('#fileIn').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0],kind=e.target.dataset.kind;
  e.target.value='';
  if(f&&kind)importFile(kind,f);
});
map.on('dragstart',()=>{gpsFix=null;if(!trk)clearLoc()});
map.on('zoomstart',()=>{if(!trk&&Date.now()>locGuard)clearLoc()});

$('#addBtn').addEventListener('click',enterAdd);
$('#listBtn').addEventListener('click',enterList);
$('#progBtn').addEventListener('click',enterProgress);
$('#srchBtn').addEventListener('click',enterSearch);
$('#fitBtn').addEventListener('click',fitAll);
$('#layBtn').addEventListener('click',enterLayers);
$('#locBtn').addEventListener('click',()=>{if(trk)stopTrack();else startTrack()});

/* ---------- 輕點選取（距離判定，不依賴 click 事件，適合 iPad 手指） ---------- */
const mapEl=map.getContainer();
const tapS=new Map(),TAP_MS=800,HOLD_MS=800;
function distSeg(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;let t=l?((p.x-a.x)*dx+(p.y-a.y)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)}
function handleTap(cx,cy,touch){
  const r=mapEl.getBoundingClientRect(),cp=L.point(cx-r.left,cy-r.top);
  const R=touch?36:18;let best=null,bd=R+1;
  markers.forEach((m,id)=>{
    const q=map.latLngToContainerPoint(m.getLatLng());
    const d0=Math.hypot(q.x-cp.x,q.y-cp.y);if(d0>R)return;
    const d=d0-(isK(id)?0:6);
    if(d<bd){bd=d;best=id}
  });
  if(best){onPin(best);return}
  if(mode==='detail'||mode==='list'||mode==='layers'||mode==='progress'||mode==='line'||mode==='search')closeAll();
}
function nearLine(cx,cy,touch){
  const r=mapEl.getBoundingClientRect(),cp=L.point(cx-r.left,cy-r.top);
  const R=touch?36:18;let near=false;
  markers.forEach(m=>{if(near)return;const q=map.latLngToContainerPoint(m.getLatLng());if(Math.hypot(q.x-cp.x,q.y-cp.y)<=R)near=true});
  if(near)return null;
  const LR=touch?30:14;let bl=null,bd=LR+1;
  lines.forEach((l,k)=>{
    const a=getPt(l.a),b=getPt(l.b);if(!a||!b)return;
    const d=distSeg(cp,map.latLngToContainerPoint([a.lat,a.lng]),map.latLngToContainerPoint([b.lat,b.lng]));
    if(d<bd){bd=d;bl=k}
  });
  return bl;
}
/* 清掉殘留紀錄：iOS 偶爾漏送放開事件，殘留的手指會讓之後每次點擊都被當成兩指操作 */
function purgeTaps(all){const now=Date.now();tapS.forEach((v,k)=>{if(all||now-v.t>2000){clearTimeout(v.timer);tapS.delete(k)}})}
function resetTouch(){purgeTaps(true);if(lp)endMove(true)}
mapEl.addEventListener('pointerdown',e=>{
  if(e.target.closest&&e.target.closest('.leaflet-control,button,a'))return;
  purgeTaps(e.isPrimary);
  const s0={x:e.clientX,y:e.clientY,t:Date.now(),type:e.pointerType};
  tapS.set(e.pointerId,s0);
  if(tapS.size>1)tapS.forEach(v=>{v.bad=true;clearTimeout(v.timer)});
  else if(mode!=='link'&&mode!=='add'&&mode!=='move'&&!(e.target.closest&&e.target.closest('.pin[data-id]'))){
    s0.timer=setTimeout(()=>{
      if(s0.bad||s0.moved||(lp&&lp.moving))return;
      const k=nearLine(s0.x,s0.y,s0.type!=='mouse');
      if(k){s0.fired=true;try{if(navigator.vibrate)navigator.vibrate(30)}catch(err){}showLineInfo(k)}
    },600);
  }
},true);
addEventListener('pointermove',e=>{const s0=tapS.get(e.pointerId);if(s0&&!s0.moved&&Math.hypot(e.clientX-s0.x,e.clientY-s0.y)>10){s0.moved=true;clearTimeout(s0.timer)}});
document.addEventListener('pointerup',e=>{
  const s0=tapS.get(e.pointerId);tapS.delete(e.pointerId);
  if(s0)clearTimeout(s0.timer);
  if(!s0||s0.fired||s0.bad||(lp&&lp.moving)||Date.now()-lpLast<600)return;
  if(Date.now()-s0.t>TAP_MS||Math.hypot(e.clientX-s0.x,e.clientY-s0.y)>20)return;
  handleTap(e.clientX,e.clientY,s0.type!=='mouse');
},true);
document.addEventListener('pointercancel',e=>{const s0=tapS.get(e.pointerId);if(s0)clearTimeout(s0.timer);tapS.delete(e.pointerId)},true);
/* 備援：所有手指都離開螢幕時，清掉還沒收到放開事件的紀錄 */
document.addEventListener('touchend',e=>{if(e.touches&&e.touches.length)return;setTimeout(()=>{if(tapS.size)purgeTaps(true);if(lp&&lp.type==='touch')endMove(false)},80)},true);
document.addEventListener('touchcancel',e=>{if(e.touches&&e.touches.length)return;setTimeout(()=>{if(tapS.size)purgeTaps(true);if(lp&&lp.type==='touch')endMove(true)},80)},true);
document.addEventListener('visibilitychange',()=>{if(document.hidden)resetTouch()});
addEventListener('pagehide',resetTouch);
window.__cpt={onPin,showLineInfo,handleTap,nearLine};

/* ---------- 長按點位選取並拖曳 ---------- */
mapEl.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.pin'))e.preventDefault()});
mapEl.addEventListener('pointerdown',e=>{
  if(lp&&e.pointerId!==lp.pid&&e.isPrimary)endMove(true);
  if(lp||(e.pointerType==='mouse'&&e.button!==0))return;
  const pin=e.target.closest&&e.target.closest('.pin[data-id]');if(!pin)return;
  const id=pin.dataset.id;
  if(isK(id)||!points.has(id)||mode==='link'||mode==='add'||mode==='move')return;
  lp={id,x:e.clientX,y:e.clientY,pid:e.pointerId,type:e.pointerType,moving:false,moved:false,timer:setTimeout(startMove,HOLD_MS)};
});
addEventListener('pointermove',e=>{
  if(!lp||e.pointerId!==lp.pid)return;
  if(!lp.moving){if(Math.hypot(e.clientX-lp.x,e.clientY-lp.y)>10){clearTimeout(lp.timer);lp=null}return}
  const p=points.get(lp.id);if(!p)return;
  const r=mapEl.getBoundingClientRect(),ll=map.containerPointToLatLng(L.point(e.clientX-r.left+lp.dx,e.clientY-r.top+lp.dy));
  p.lat=ll.lat;p.lng=ll.lng;lp.moved=true;lp.cur={lat:ll.lat,lng:ll.lng};draw();
});
function endMove(cancel){
  if(!lp)return;
  const s0=lp;lp=null;clearTimeout(s0.timer);
  if(!s0.moving)return;
  map.dragging.enable();lpLast=Date.now();
  const p=points.get(s0.id);
  if(p&&s0.moved&&!cancel){askMove(s0.id,s0.o,{lat:p.lat,lng:p.lng});return}
  dragId=null;
  if(p&&s0.moved){p.lat=s0.o.lat;p.lng=s0.o.lng}
  if(points.has(s0.id))select(s0.id);else draw();
}
/* 拖曳放開後先確認：儲存才寫入資料庫，取消回到原位 */
let mvLayers=[];
function clearMvLayers(){mvLayers.forEach(l=>map.removeLayer(l));mvLayers=[]}
function askMove(id,o,n){
  const p=points.get(id);if(!p)return;
  pendMove={id,o,n};dragId=id;sel=id;mode='move';$('#cross').hidden=true;
  clearMvLayers();
  mvLayers.push(L.polyline([[o.lat,o.lng],[n.lat,n.lng]],{color:'#e8590c',weight:2,dashArray:'5 5',interactive:false}).addTo(map));
  mvLayers.push(L.circleMarker([o.lat,o.lng],{radius:6,color:'#e8590c',weight:2,fillColor:'#ffffff',fillOpacity:.9,interactive:false}).addTo(map));
  const d=distM(o,n);
  showSheet('<div class="head"><h2>確認移動 '+esc(p.name)+'</h2><button class="x" data-act="moveNo" aria-label="取消">×</button></div>'+
   '<div class="card2"><div class="mono"><b>移動 '+(d>=1000?fmtDist(d):d.toFixed(2)+' m')+'</b><br>新位置 '+esc(tmLine(n))+'</div></div>'+
   '<p class="hint">確定要把 '+esc(p.name)+' 移到新位置嗎？按「取消」會回到原位置（地圖上的白色圓圈），不會寫入資料。</p>'+
   '<div class="btns"><button class="btn pri" data-act="moveYes">儲存新位置</button><button class="btn" data-act="moveNo">取消</button></div>');
  draw();
}
function endAskMove(save){
  const m=pendMove;pendMove=null;dragId=null;clearMvLayers();
  if(!m)return;
  const p=points.get(m.id);
  if(save&&p){movePoint(m.id,m.n.lat,m.n.lng);select(m.id);return}
  if(p){p.lat=m.o.lat;p.lng=m.o.lng}
  if(save)toast('這個點已被刪除，未儲存');else toast('已取消，回到原位置');
}
document.addEventListener('pointerup',e=>{if(lp&&e.pointerId===lp.pid)endMove(false)},true);
document.addEventListener('pointercancel',e=>{if(lp&&e.pointerId===lp.pid)endMove(true)},true);
function startMove(){
  if(!lp)return;
  const s0=lp,p=points.get(s0.id);if(!p){lp=null;return}
  s0.moving=true;s0.o={lat:p.lat,lng:p.lng};
  if(mode!=='idle')closeAll();
  map.dragging.disable();
  const pt=map.latLngToContainerPoint([p.lat,p.lng]),r=mapEl.getBoundingClientRect();
  s0.dx=pt.x-(s0.x-r.left);s0.dy=pt.y-(s0.y-r.top);
  dragId=s0.id;draw();
  try{if(navigator.vibrate)navigator.vibrate(40)}catch(err){}
  toast('已選取 '+p.name+'，手指不放開，直接拖到新位置，放開後確認是否儲存');
}

/* ---------- login ---------- */
function setWho(){$('#whoBtn').textContent=me||'登入'}
function askLogin(){
  $('#nameIn').value=me;$('#pwIn').value='';
  $('#loginCancel').hidden=!(me&&code);
  $('#login').hidden=false;
  setTimeout(()=>(me?$('#pwIn'):$('#nameIn')).focus(),50);
}
$('#whoBtn').addEventListener('click',askLogin);
$('#loginCancel').addEventListener('click',()=>{$('#login').hidden=true});
$('#copyLink').addEventListener('click',async()=>{
  const typed=$('#pwIn').value.trim();
  const pj=typed?await resolveProject(typed):(code?{name:curName,code,dir:curDir}:null);
  if(!pj){toast(typed?'密碼錯誤':'請先輸入專案密碼');return}
  const url=location.origin+location.pathname+'#'+pj.code;
  try{await navigator.clipboard.writeText(url);toast('已複製，貼給組員即可直接進入「'+pj.name+'」（連結含密碼，請只給組員）')}
  catch(e){showInfo('分享連結','<p class="hint" style="word-break:break-all;user-select:all">'+esc(url)+'</p><p class="hint">長按上面的連結即可複製。連結含密碼，請只給組員。</p>')}
});
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const n=$('#nameIn').value.trim(),typed=$('#pwIn').value.trim();
  if(!n)return;
  let pj=null;
  if(typed){pj=await resolveProject(typed);if(!pj){toast('密碼錯誤，請再確認');return}}
  else if(code)pj={name:curName,code,dir:curDir};
  else{toast('請輸入專案密碼');return}
  const changed=pj.code!==code;
  me=n;code=pj.code;curName=pj.name;curDir=pj.dir;store.set('cp_name',me);store.set('cp_pw',code);
  $('#login').hidden=true;setWho();
  if(changed||!unsubs.length)startSync();else{draw();setStatus()}
  if(changed)loadStatic();
});

/* ---------- sync ---------- */
function resetLocal(){
  unsubs.forEach(u=>u());unsubs=[];
  points.clear();lines.clear();rstat.clear();
  markers.forEach(m=>map.removeLayer(m));markers.clear();
  polys.forEach(o=>{map.removeLayer(o.v);map.removeLayer(o.h)});polys.clear();
  fitted=false;pending=false;syncErr=false;
  if(mode!=='idle')closeAll();
}
function startSync(){resetLocal();subscribe()}
/* 重新建立即時監聽（不清除畫面）：回到前景、恢復網路或手動點狀態列時使用 */
function subscribe(){
  unsubs.forEach(u=>u());unsubs=[];
  if(!cfgOk||!me||code.length<6){setStatus();return}
  const onErr=()=>{syncErr=true;setStatus();toast('無法讀取資料庫，請確認 Firestore 規則已貼上並發布')};
  unsubs.push(onSnapshot(colRef('points'),{includeMetadataChanges:true},snap=>{
    syncErr=false;pending=snap.metadata.hasPendingWrites;
    points.clear();
    snap.docs.forEach(d=>{const v=d.data();if(v&&typeof v.lat==='number'&&typeof v.lng==='number')points.set(d.id,Object.assign({id:d.id},v))});
    /* 拖曳中或等待確認的點，畫面維持在新位置（尚未寫入） */
    const mv=pendMove?{id:pendMove.id,ll:pendMove.n}:(lp&&lp.moving&&lp.cur)?{id:lp.id,ll:lp.cur}:null;
    if(mv){const q=points.get(mv.id);if(q){q.lat=mv.ll.lat;q.lng=mv.ll.lng}}
    if(!fitted&&points.size){fitted=true;map.fitBounds(L.latLngBounds([...points.values()].map(p=>[p.lat,p.lng])).pad(.3),{maxZoom:19})}
    draw();
  },onErr));
  unsubs.push(onSnapshot(colRef('rootStat'),snap=>{
    rstat.clear();
    snap.docs.forEach(d=>{const v=d.data();if(v&&v.st)rstat.set(d.id,v)});
    draw();
  },onErr));
  unsubs.push(onSnapshot(colRef('lines'),snap=>{
    lines.clear();
    snap.docs.forEach(d=>{const v=d.data();if(v&&v.a&&v.b)lines.set(d.id,{a:v.a,b:v.b})});
    draw();
  },onErr));
  setStatus();
}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(code&&me&&Date.now()-hiddenAt>15000)subscribe()});
addEventListener('online',()=>{if(code&&me)subscribe()});
addEventListener('pageshow',e=>{if(e.persisted&&code&&me)subscribe()});
document.querySelector('.brand').addEventListener('click',()=>{if(!code||!me)return;subscribe();toast('已重新同步')});
setWho();
setStatus();
(async()=>{
  const pw0=pendingPw||store.get('cp_pw');
  if(pw0){const pj=await resolveProject(pw0);if(pj){code=pj.code;curName=pj.name;curDir=pj.dir;store.set('cp_pw',code);loadStatic()}else{code='';store.set('cp_pw','');if(pendingPw)toast('連結裡的密碼不正確')}}
  setStatus();
  if(!cfgOk)showInfo('尚未設定資料庫','<p class="hint">網頁裡的 Firebase 設定還沒填入。完成設定後，這個畫面就會消失。</p>');
  else if(!me||!code)askLogin();
  else startSync();
})();
</script>
