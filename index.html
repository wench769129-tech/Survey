<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d6b5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>控制點選點</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 全螢幕地圖，頂部狀態列，底部抽屜面板（新增／點位資料／通視編輯／清單／圖層與資料） */
:root{
  --bg:#f1f3ef; --surface:#ffffff; --fg:#17211c; --muted:#5b6861; --line:#d3dad4;
  --accent:#0d6b5b; --accent-fg:#ffffff; --sight:#e8590c; --danger:#c22a2a; --halo:rgba(13,107,91,.18);
  --known:#7a3fb5; --ok:#1f8a3b;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101612; --surface:#19211c; --fg:#e6ece7; --muted:#9aa8a0; --line:#2c3831;
  --accent:#3fc4a8; --accent-fg:#06211b; --sight:#ff922b; --danger:#ff7a7a; --halo:rgba(63,196,168,.22);
  --known:#b98cf0; --ok:#4fd36e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101612; --surface:#19211c; --fg:#e6ece7; --muted:#9aa8a0; --line:#2c3831;
  --accent:#3fc4a8; --accent-fg:#06211b; --sight:#ff922b; --danger:#ff7a7a; --halo:rgba(63,196,168,.22);
  --known:#b98cf0; --ok:#4fd36e; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

#map{position:fixed;inset:0;z-index:0;background:#cfd6d1}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 82%,transparent)!important;color:var(--muted)!important;font-size:10px}
.leaflet-control-attribution a{color:inherit!important}

/* markers */
.pinwrap{background:none;border:0}
.pin{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;transform:translate(-14px,-14px);pointer-events:none}
.pin i{pointer-events:auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
.pin i::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--accent);border:2.5px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.45)}
.pin span{pointer-events:none;background:color-mix(in srgb,var(--surface) 92%,transparent);color:var(--fg);font-size:12px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.pin.kn i::after{border-radius:3px;background:var(--known);width:13px;height:13px;transform:rotate(45deg)}
.pin.kn span{color:var(--known)}
.pin.sel i{background:var(--halo)}
.pin.sel i::after{background:var(--sight);width:18px;height:18px}
.pin.cand i::after{background:#fff;border-color:var(--sight)}
.pin.lk i::after{background:var(--sight)}
.pin.mv i{background:rgba(232,89,12,.28);outline:2px dashed var(--sight)}

/* top bar */
.top{position:fixed;z-index:1100;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 14px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:15px;line-height:1.2}
.brand small{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0}
.brand small span+span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:#2fb344}.dot.bad{background:var(--danger)}.dot.wait{background:#f0a400}
.chip{min-height:40px;max-width:44vw;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.seg{align-self:flex-start;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.seg button{min-height:36px;padding:0 14px;border:0;border-radius:7px;background:none;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}

/* fabs */
.fabs{position:fixed;z-index:1100;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);display:flex;flex-direction:column;gap:10px}
.round{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.22)}
.round svg{width:22px;height:22px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#addBtn{position:fixed;z-index:1100;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);min-height:54px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-fg);font-size:17px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3)}
body.has-sheet .fabs,body.has-sheet #addBtn{display:none}

/* crosshair */
#cross{position:fixed;z-index:1050;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:none}
#cross svg{width:100%;height:100%;stroke:var(--sight);stroke-width:2.5;fill:none;filter:drop-shadow(0 0 2px #fff)}

/* sheet */
#sheet{position:fixed;z-index:1200;left:0;right:0;bottom:0;max-height:64vh;overflow-y:auto;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.28);padding:6px 16px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:12px}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);align-self:center;flex:none}
.head{display:flex;gap:8px;align-items:center}
.head h2{margin:0;font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1;flex:none}
.mini{min-height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:700;flex:none}
.in{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;font-size:16px;min-width:0}
textarea.in{min-height:64px;padding:10px 12px;resize:vertical}
.mono{font-family:var(--mono);font-size:13px;color:var(--fg);overflow-wrap:anywhere;line-height:1.7}
.mono small{color:var(--muted);font-family:var(--font);font-size:12px}
.label{font-size:12px;color:var(--muted);letter-spacing:.06em;margin-bottom:4px;display:block}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:15px}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sight{background:var(--sight);border-color:var(--sight);color:#fff}
.btn.dng{color:var(--danger)}
.btn.dngfill{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.on{background:var(--sight);border-color:var(--sight);color:#fff}
.btn[disabled]{opacity:.55}
.hint{margin:0;font-size:14px;color:var(--muted);line-height:1.6}
.meta{font-size:12px;color:var(--muted);line-height:1.7}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list li{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;min-height:46px}
.list li+li{border-top:1px solid var(--line)}
.list .nm{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .d{font-family:var(--mono);font-size:13px;color:var(--muted)}
.list button.rm{min-height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:13px;color:var(--danger)}
.list button.go{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:44px;border:0;background:none;text-align:left;padding:0}
.empty{padding:14px;color:var(--muted);font-size:14px}
.swatch{display:inline-block;width:18px;height:3px;background:var(--sight);vertical-align:middle;margin-right:6px;border-radius:2px}
.card2{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.seg2{display:flex;gap:6px}
.seg2 button{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:15px}
.seg2 button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.numrow{display:flex;gap:8px}
.numrow .seg2{flex:0 0 auto}
.numrow .seg2 button{min-width:56px;flex:none}
.numrow .in{flex:1;font-family:var(--mono);font-weight:600;font-size:18px;text-align:center}
.msg{font-size:13px;line-height:1.5;min-height:20px;color:var(--muted)}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--danger)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two .in{font-family:var(--mono)}
.row{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer}
.row input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.row span{flex:1;min-width:0;line-height:1.45}
.grp{display:flex;flex-direction:column;gap:8px;padding-top:4px}
details.grp>summary{cursor:pointer;color:var(--muted);font-size:13px;min-height:36px;display:flex;align-items:center}
ol.steps{margin:0;padding-left:20px;line-height:1.8;font-size:14px}

/* toast + modal */
#toast{position:fixed;z-index:1400;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 112px);margin:auto;max-width:420px;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.5;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.modal{position:fixed;z-index:1300;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;overflow-y:auto}
.card{width:100%;max-width:400px;background:var(--surface);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.card h1{margin:0;font-size:20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="map"></div>
<div id="cross" hidden><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="9"/><path d="M22 2v10M22 32v10M2 22h10M32 22h10"/></svg></div>

<div class="top">
  <div class="bar">
    <div class="brand"><b>控制點選點</b><small><span class="dot" id="dot"></span><span id="stat">尚未進入專案</span></small></div>
    <button class="chip" id="whoBtn" aria-label="姓名與專案代碼">登入</button>
  </div>
  <div class="seg" role="group" aria-label="底圖">
    <button type="button" data-b="emap" aria-pressed="true">電子地圖</button>
    <button type="button" data-b="photo" aria-pressed="false">正射影像</button>
  </div>
</div>

<div class="fabs">
  <button class="round" id="layBtn" aria-label="圖層與資料"><svg viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></button>
  <button class="round" id="listBtn" aria-label="點位清單"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg></button>
  <button class="round" id="locBtn" aria-label="我的位置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
</div>
<button id="addBtn">＋ 新增點位</button>

<section id="sheet" hidden></section>
<div id="toast" role="status"></div>
<input type="file" id="fileIn" hidden>

<div id="login" class="modal" hidden>
  <form class="card" id="loginForm">
    <h1>姓名與專案</h1>
    <p class="hint">姓名會記錄在你新增和修改的點位上。同一個專案代碼的人會看到同一份資料，代碼請只分享給組員。</p>
    <div><label class="label" for="nameIn">你的姓名</label><input class="in" id="nameIn" maxlength="20" autocomplete="off" placeholder="例如：王小明" required></div>
    <div><label class="label" for="codeIn">專案代碼（至少 6 個英數字）</label><input class="in" id="codeIn" maxlength="40" autocomplete="off" autocapitalize="none" placeholder="例如：chiayi2610" required></div>
    <div class="btns">
      <button class="btn pri" type="submit">進入專案</button>
      <button class="btn" type="button" id="copyLink">複製分享連結</button>
    </div>
    <button class="btn" type="button" id="loginCancel" hidden>取消</button>
  </form>
</div>

<div id="info" class="modal" hidden>
  <div class="card">
    <h1 id="infoTitle"></h1>
    <div id="infoBody"></div>
    <button class="btn pri" id="infoOk" type="button">知道了</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getFirestore,initializeFirestore,persistentLocalCache,collection,doc,setDoc,updateDoc,deleteDoc,onSnapshot,runTransaction,writeBatch} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* ====== Firebase 設定 ====== */
const firebaseConfig={
  apiKey:"AIzaSyClBHkUDYzNqigkMyv-RrLrcGr40yA21h4",
  authDomain:"survey-cp.firebaseapp.com",
  projectId:"survey-cp",
  storageBucket:"survey-cp.firebasestorage.app",
  messagingSenderId:"537636434821",
  appId:"1:537636434821:web:57c02a4be30f001fc4caec"
};
/* =========================== */

/* PURE:START */
/* ---- TWD97 TM2（121°E 二度分帶，EPSG:3826）---- */
const TM={a:6378137,f:1/298.257222101,k0:0.9999,lon0:121,FE:250000};
const TMc=(()=>{
  const n=TM.f/(2-TM.f),n2=n*n,n3=n2*n,n4=n3*n;
  return{n,A:TM.a/(1+n)*(1+n2/4+n4/64+n3*n3/256),
    al:[n/2-2*n2/3+5*n3/16+41*n4/180,13*n2/48-3*n3/5+557*n4/1440,61*n3/240-103*n4/140,49561*n4/161280],
    be:[n/2-2*n2/3+37*n3/96-n4/360,n2/48+n3/15-437*n4/1440,17*n3/480-37*n4/840,4397*n4/161280],
    de:[2*n-2*n2/3-2*n3+116*n4/45,7*n2/3-8*n3/5-227*n4/45,56*n3/15-136*n4/35,4279*n4/630]};
})();
const RAD=Math.PI/180;
function toTM2(lat,lng){
  const {n,A,al}=TMc,p=lat*RAD,l=(lng-TM.lon0)*RAD,c=2*Math.sqrt(n)/(1+n);
  const t=Math.sinh(Math.atanh(Math.sin(p))-c*Math.atanh(c*Math.sin(p)));
  const x0=Math.atan2(t,Math.cos(l)),e0=Math.atanh(Math.sin(l)/Math.sqrt(1+t*t));
  let xi=x0,eta=e0;
  for(let j=1;j<=4;j++){xi+=al[j-1]*Math.sin(2*j*x0)*Math.cosh(2*j*e0);eta+=al[j-1]*Math.cos(2*j*x0)*Math.sinh(2*j*e0)}
  return{N:TM.k0*A*xi,E:TM.FE+TM.k0*A*eta};
}
function fromTM2(N,E){
  const {A,be,de}=TMc,xi=N/(TM.k0*A),eta=(E-TM.FE)/(TM.k0*A);
  let x0=xi,e0=eta;
  for(let j=1;j<=4;j++){x0-=be[j-1]*Math.sin(2*j*xi)*Math.cosh(2*j*eta);e0-=be[j-1]*Math.cos(2*j*xi)*Math.sinh(2*j*eta)}
  const chi=Math.asin(Math.sin(x0)/Math.cosh(e0));
  let lat=chi;for(let j=1;j<=4;j++)lat+=de[j-1]*Math.sin(2*j*chi);
  return{lat:lat/RAD,lng:TM.lon0+Math.atan2(Math.sinh(e0),Math.cos(x0))/RAD};
}
function inTaiwan(lat,lng){return lat>=21.5&&lat<=26.5&&lng>=119.5&&lng<=122.5}

/* ---- 新設點編號：BI001、HI001 ---- */
const PREFIXES=['BI','HI'];
const fmtName=(p,n)=>p+String(n).padStart(3,'0');
function parseName(s){const m=/^(BI|HI)(\d+)$/i.exec(String(s||'').trim());return m?{p:m[1].toUpperCase(),n:parseInt(m[2],10)}:null}
function nextNum(names,p){let mx=0;for(const s of names){const q=parseName(s);if(q&&q.p===p&&q.n>mx)mx=q.n}return mx+1}
const nameKey=s=>encodeURIComponent(String(s).trim().toUpperCase());
const nameCmp=(a,b)=>String(a).localeCompare(String(b),'en',{numeric:true});

/* ---- KML 解析 ---- */
function parseCoords(txt){
  return String(txt||'').trim().replace(/,\s+/g,',').split(/\s+/).map(s=>{const q=s.split(',');return[parseFloat(q[1]),parseFloat(q[0])]}).filter(c=>isFinite(c[0])&&isFinite(c[1]));
}
function parseKml(text){
  if(/^PK/.test(text))return{error:'kmz'};
  const doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.getElementsByTagName('parsererror').length)return{error:'xml'};
  const points=[],lines=[],cs=doc.getElementsByTagNameNS('*','coordinates');
  for(let i=0;i<cs.length;i++){
    const el=cs[i],kind=el.parentNode&&el.parentNode.localName,pm=el.closest('Placemark');
    let name='';
    if(pm){for(const ch of pm.children){if(ch.localName==='name'){name=(ch.textContent||'').trim();break}}}
    const c=parseCoords(el.textContent);
    if(kind==='Point'){if(c.length)points.push({name,lat:c[0][0],lng:c[0][1]})}
    else if((kind==='LineString'||kind==='LinearRing')&&c.length>=2)lines.push({name,coords:c});
  }
  return{points,lines};
}
/* 地籍圖用：不建 DOM，直接抓座標（檔案大時較省記憶體） */
function parseKmlLines(text){
  if(/^PK/.test(text))return{error:'kmz'};
  const re=/<(?:\w+:)?coordinates[^>]*>([\s\S]*?)<\/(?:\w+:)?coordinates>/g,rings=[];let m;
  while((m=re.exec(text))){const c=parseCoords(m[1].replace(/<!\[CDATA\[|\]\]>/g,''));if(c.length>=2)rings.push(c)}
  return{rings};
}

/* ---- 匯出 ---- */
const csvEsc=v=>{const s=v==null?'':String(v);return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
function buildCsv(pts,opt){
  const rows=[];
  if(opt.header)rows.push(['點名','N','E'].concat(opt.extra?['緯度','經度','精度(m)','建立者','最後修改者','備註']:[]));
  pts.slice().sort((a,b)=>nameCmp(a.name,b.name)).forEach(p=>{
    const t=toTM2(p.lat,p.lng),r=[p.name,t.N.toFixed(3),t.E.toFixed(3)];
    if(opt.extra)r.push(p.lat.toFixed(8),p.lng.toFixed(8),p.acc!=null?Math.round(p.acc):'',p.by||'',p.editedBy||p.by||'',p.note||'');
    rows.push(r);
  });
  return '﻿'+rows.map(r=>r.map(csvEsc).join(',')).join('\r\n')+'\r\n';
}
const xmlEsc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
function distM(a,b){const R=6371008.8,dLa=(b.lat-a.lat)*RAD,dLo=(b.lng-a.lng)*RAD;const h=Math.sin(dLa/2)**2+Math.cos(a.lat*RAD)*Math.cos(b.lat*RAD)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function buildLinesKml(lineList,title){
  const items=lineList.map(l=>({label:l.a.name+'-'+l.b.name,a:l.a,b:l.b})).sort((x,y)=>nameCmp(x.label,y.label));
  return '<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document>\n<name>'+xmlEsc(title)+'</name>\n'+
    '<Style id="sight"><LineStyle><color>ff0c59e8</color><width>3</width></LineStyle></Style>\n'+
    items.map(i=>'<Placemark><name>'+xmlEsc(i.label)+'</name><description>距離 '+distM(i.a,i.b).toFixed(2)+' m</description><styleUrl>#sight</styleUrl><LineString><tessellate>1</tessellate><coordinates>'+
      i.a.lng.toFixed(8)+','+i.a.lat.toFixed(8)+',0 '+i.b.lng.toFixed(8)+','+i.b.lat.toFixed(8)+',0</coordinates></LineString></Placemark>').join('\n')+'\n</Document></kml>\n';
}
/* PURE:END */

function setStatus(){

/* ---------- drawing ---------- */
function pinCls(id){
  const c=['pin'];
  if(isK(id))c.push('kn');
  if(sel===id){c.push('sel');if(moveMode&&!isK(id))c.push('mv')}
  else if(mode==='link'&&sel)c.push(lines.has(lineKey(sel,id))?'lk':'cand');
  return c.join(' ');
}
function upsertMarker(id,p){
  const cls=pinCls(id),sig=cls+'|'+p.name;
  let m=markers.get(id);
  if(!m){
    m=L.marker([p.lat,p.lng],{icon:L.divIcon({className:'pinwrap',iconSize:[0,0],html:'<div class="'+cls+'"><i></i><span>'+esc(p.name)+'</span></div>'}),keyboard:false,draggable:false});
    m._sig=sig;
    m.on('click',ev=>{L.DomEvent.stopPropagation(ev);onPin(id)});
    if(!isK(id))m.on('dragend',()=>{const ll=m.getLatLng();movePoint(id,ll.lat,ll.lng)});
    m.addTo(map);markers.set(id,m);
  }else{
    const ll=m.getLatLng();
    if(Math.abs(ll.lat-p.lat)>1e-10||Math.abs(ll.lng-p.lng)>1e-10)m.setLatLng([p.lat,p.lng]);
    if(m._sig!==sig){m.setIcon(L.divIcon({className:'pinwrap',iconSize:[0,0],html:'<div class="'+cls+'"><i></i><span>'+esc(p.name)+'</span></div>'}));m._sig=sig}
  }
  if(!isK(id)&&m.dragging){
    const want=moveMode&&sel===id;
    if(want&&!m.dragging.enabled())m.dragging.enable();
    else if(!want&&m.dragging.enabled())m.dragging.disable();
  }
}
function draw(){
  points.forEach((p,id)=>upsertMarker(id,p));
  known.forEach((p,id)=>{if(ly.known)upsertMarker(id,p)});
  markers.forEach((m,id)=>{
    const keep=isK(id)?(known.has(id)&&ly.known):points.has(id);
    if(!keep){map.removeLayer(m);markers.delete(id)}
  });
  const sight=getComputedStyle(document.documentElement).getPropertyValue('--sight').trim()||'#e8590c';
  lines.forEach((l,k)=>{
    const a=getPt(l.a),b=getPt(l.b);
    if(!a||!b){const o=polys.get(k);if(o){map.removeLayer(o);polys.delete(k)}return}
    const ll=[[a.lat,a.lng],[b.lat,b.lng]];
    let pl=polys.get(k);
    if(!pl){pl=L.polyline(ll,{color:sight,weight:3,opacity:.95,interactive:false}).addTo(map);polys.set(k,pl)}else pl.setLatLngs(ll);
  });
  polys.forEach((pl,k)=>{if(!lines.has(k)){map.removeLayer(pl);polys.delete(k)}});
  setStatus();
  if(pendingSel&&points.has(pendingSel)){const id=pendingSel;pendingSel=null;select(id);return}
  if(mode==='detail'||mode==='link'){if(!getPt(sel)){closeAll();return}refreshDetail()}
  else if(mode==='list')renderList();
  else if(mode==='add'){const r=$('#addEd .ed');if(r)edCheck(r)}
}

/* ---------- GPS ---------- */
async function getFix(){
  if(!window.isSecureContext||!navigator.geolocation)throw {kind:'unsupported'};
  let state='unknown';
  try{state=(await navigator.permissions.query({name:'geolocation'})).state}catch(e){}
  if(state==='denied')throw {kind:'denied'};
  if(state==='prompt')toast('接下來手機會詢問是否允許位置，請選「允許」');
  return new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(p=>res(p.coords),
    err=>rej({kind:err.code===1?'denied':err.code===3?'timeout':'unavailable'}),
    {enableHighAccuracy:true,timeout:25000,maximumAge:0}));
}
function gpsProblem(e){
  const kind=e&&e.kind;
  if(kind==='denied'){
    const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
    showInfo('需要允許位置權限', ios
      ?'<ol class="steps"><li>開啟手機「設定」→「隱私權與安全性」→「定位服務」，確認已開啟。</li><li>在同一頁往下找到「Safari 網站」，選「使用 App 期間」。</li><li>回到網頁，點網址列左側的「aA」→「網站設定」→「位置」→「允許」。</li><li>重新整理頁面，再按一次定位。</li></ol>'
      :'<ol class="steps"><li>點網址列左側的圖示（鎖頭或調整圖示）→「權限」→「位置」→「允許」。</li><li>重新整理頁面，再按一次定位。</li><li>若仍失敗，到手機「設定」→「位置」確認定位已開啟，並選擇高精確度。</li></ol>');
  }else if(kind==='unsupported')showInfo('無法使用定位','<p class="hint">這個瀏覽器或網址不支援定位。請用 Chrome 或 Safari 開啟 https 網址。你仍可以移動地圖，讓十字對準位置來新增點位。</p>');
  else if(kind==='timeout')toast('定位逾時，請到空曠處再試一次');
  else toast('暫時無法取得位置，請確認手機定位已開啟');
}
function showMe(c){
  if(meDot)map.removeLayer(meDot);
  meDot=L.circle([c.latitude,c.longitude],{radius:Math.max(c.accuracy||5,3),color:'#2563eb',weight:1,fillColor:'#2563eb',fillOpacity:.15,interactive:false}).addTo(map);
}

/* ---------- 寫入（點號用 names 登記，避免兩人同時取到同一號） ---------- */
async function createPoint(name,data){
  const pid=doc(colRef('points')).id;
  await runTransaction(fs,async t=>{
    const nref=docRef('names',nameKey(name)),s=await t.get(nref);
    if(s.exists())throw {code:'dup'};
    t.set(nref,{pid,at:Date.now()});
    t.set(docRef('points',pid),data);
  });
  return pid;
}
async function renamePoint(pid,newName){
  const old=points.get(pid).name;
  await runTransaction(fs,async t=>{
    const nref=docRef('names',nameKey(newName)),oref=docRef('names',nameKey(old));
    const ns=await t.get(nref),os=await t.get(oref);
    if(ns.exists()&&ns.data().pid!==pid)throw {code:'dup'};
    t.set(nref,{pid,at:Date.now()});
    if(os.exists()&&os.data().pid===pid&&nameKey(old)!==nameKey(newName))t.delete(oref);
    t.update(docRef('points',pid),{name:newName,editedBy:me,editedAt:Date.now()});
  });
}
function txFail(err){
  if(err&&err.code==='dup')toast('這個點號剛被別人使用，請改用下一個號碼');
  else toast('需要網路連線才能確認點號不重複，請稍後再試');
}

async function confirmAdd(){
  if(busy)return;
  const root=$('#addEd .ed'),p=root.dataset.p;

  if(!navigator.onLine){toast('目前沒有網路，無法取得新點號');return}
  const c=map.getCenter();
  let lat=c.lat,lng=c.lng,acc=null,src='map';

function fillDetail(first){

  $('#dName').textContent=p.name||'';

  await savePoint({lat,lng,acc:null,src:'manual'});
  $('#posBox').hidden=true;$('#posBox').innerHTML='';
  map.panTo([lat,lng]);toast('座標已更新');

function setImpMsg(t){impMsg=t;const el=$('#impMsg');if(el)el.textContent=t}
function saveFile(name,text,mime){
  const blob=new Blob([text],{type:mime}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
}
const stamp=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())};
function exportCsv(){
  if(needProject())return;
  if(!points.size){toast('還沒有新設點可以匯出');return}
  saveFile('newpoints_'+code+'_'+stamp()+'.csv',buildCsv([...points.values()],csvOpt),'text/csv;charset=utf-8');
  toast('已匯出 '+points.size+' 個新設點，請到手機的下載項目查看');
}
function exportKml(){
  if(needProject())return;
  const list=[];lines.forEach(l=>{const a=getPt(l.a),b=getPt(l.b);if(a&&b)list.push({a,b})});
  if(!list.length){toast('還沒有通視線可以匯出');return}
  saveFile('sightlines_'+code+'_'+stamp()+'.kml',buildLinesKml(list,'通視線 '+code),'application/vnd.google-earth.kml+xml');
  toast('已匯出 '+list.length+' 條通視線，請到手機的下載項目查看');
}
async function commitChunks(ops,size){
  for(let i=0;i<ops.length;i+=size){
    const b=writeBatch(fs);
    ops.slice(i,i+size).forEach(o=>o(b));
    await b.commit();
  }
}
async function importFile(kind,file){
  setImpMsg('讀取檔案中…');
  let text;
  try{text=await file.text()}catch(e){setImpMsg('無法讀取這個檔案');return}
  await new Promise(r=>setTimeout(r,30));
  if(kind==='cad'){
    setImpMsg('解析地籍圖中，檔案大時需要一點時間…');
    await new Promise(r=>setTimeout(r,30));
    const r=parseKmlLines(text);
    if(r.error==='kmz'){setImpMsg('這是 KMZ 壓縮檔，請先解壓縮，用裡面的 .kml 檔匯入。');return}
    if(!r.rings.length){setImpMsg('檔案裡沒有找到線段座標，請確認是地籍圖的 KML。');return}
    try{await idb.set('cad',{name:file.name,rings:r.rings})}catch(e){setImpMsg('已載入，但無法存到這支手機，下次開啟需要重新匯入。')}
    ly.cad=true;store.set('cp_ly_cad','1');setCad(r.rings,file.name);
    if(cadLayer)map.fitBounds(cadLayer.getBounds());
    setImpMsg('地籍圖已載入：'+r.rings.length.toLocaleString()+' 條線。');
    if(mode==='layers')renderLayers();
    return;
  }
  if(needProject())return;
  const r=parseKml(text);
  if(r.error==='kmz'){setImpMsg('這是 KMZ 壓縮檔，請先解壓縮，用裡面的 .kml 檔匯入。');return}
  if(r.error){setImpMsg('檔案無法解析，請確認是 KML 格式。');return}
  if(!r.points.length){setImpMsg('檔案裡沒有點位（需要 Placemark 的 Point）。');return}
  if(!navigator.onLine){setImpMsg('目前沒有網路，無法匯入。');return}
  busy=true;
  try{
    const now=Date.now();
    if(kind==='known'){
      const seen=new Map();
      r.points.forEach(p=>{if(p.name)seen.set(p.name,p)});
      const ops=[...seen.values()].map(p=>b=>b.set(docRef('known','k_'+encodeURIComponent(p.name)),{name:p.name,lat:p.lat,lng:p.lng,by:me,at:now}));
      setImpMsg('匯入已知點中…');
      await commitChunks(ops,400);
      const skipped=r.points.length-seen.size;
      setImpMsg('已匯入 '+seen.size+' 個已知點'+(skipped?'（'+skipped+' 個沒有名稱或名稱重複，已略過）':'')+'。');
      ly.known=true;store.set('cp_ly_known','1');
      if(seen.size&&!fitted){const f=[...seen.values()][0];map.setView([f.lat,f.lng],17)}
    }else{
      const names=new Set(allNames().map(s=>String(s).trim().toUpperCase())),add=[];let skip=0;
      r.points.forEach(p=>{
        const u=p.name.trim().toUpperCase();
        if(!u||names.has(u)){skip++;return}
        names.add(u);add.push(p);
      });
      const ops=add.map(p=>b=>{
        const pid=doc(colRef('points')).id;
        b.set(docRef('points',pid),{name:p.name.trim(),lat:p.lat,lng:p.lng,acc:null,src:'import',note:'',by:me,at:now,editedBy:me,editedAt:now});
        b.set(docRef('names',nameKey(p.name)),{pid,at:now});
      });
      setImpMsg('匯入新設點中…');
      await commitChunks(ops,200);
      setImpMsg('已匯入 '+add.length+' 個新設點'+(skip?'（'+skip+' 個點號已存在或沒有名稱，已略過）':'')+'。');
    }
  }catch(err){setImpMsg('匯入失敗，請確認網路與資料庫規則後再試。')}
  finally{busy=false}
  draw();
}
async function clearKnown(){
  if(needProject())return;
  const ops=[...known.keys()].map(id=>b=>b.delete(docRef('known',id)));
  try{await commitChunks(ops,400);setImpMsg('已刪除全部已知點。')}catch(e){setImpMsg('刪除失敗，請稍後再試。')}
}

/* ---------- events ---------- */
sheet.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.rm){toggleLine(sel,t.dataset.rm);return}
  if(t.dataset.go){const p=getPt(t.dataset.go);if(p){if(isK(p.id)&&!ly.known){ly.known=true;store.set('cp_ly_known','1')}map.setView([p.lat,p.lng],Math.max(map.getZoom(),18));select(p.id)}return}
  if(t.dataset.tab){listTab=t.dataset.tab;renderList();return}
  if(t.dataset.sys){posSys=t.dataset.sys;fillPos();return}
  if(t.dataset.imp){const f=$('#fileIn');f.dataset.kind=t.dataset.imp;f.click();return}
  switch(t.dataset.act){
    case 'close':closeAll();break;
    case 'gps':{
      const h=$('#addHint');h.textContent='定位中…';
      getFix().then(c=>{gpsFix={lat:c.latitude,lng:c.longitude,acc:c.accuracy};showMe(c);map.setView([c.latitude,c.longitude],Math.max(map.getZoom(),19));h.textContent='已取得位置，精度約 ±'+Math.round(c.accuracy)+' m。可直接確認，或移動地圖微調。'})
        .catch(err=>{h.textContent='沒有取得定位。你仍可移動地圖，讓十字對準位置後確認。';gpsProblem(err)});
      break}
    case 'confirmAdd':confirmAdd();break;
    case 'rename':openRename();break;
    case 'renameApply':applyRename();break;
    case 'copyTM':{const p=getPt(sel);if(p)navigator.clipboard.writeText(tmText(p)).then(()=>toast('已複製 N,E')).catch(()=>toast('無法複製，請直接長按座標選取'));break}
    case 'posEdit':openPos();break;
    case 'posApply':applyPos();break;
    case 'move':moveMode=!moveMode;fillDetail(false);draw();if(moveMode)toast('按住地圖上橘色虛線框的點位，拖到新位置後放開');break;
    case 'link':enterLink();break;
    case 'linkDone':select(sel);break;
    case 'del':confirmDel=true;fillDetail(false);break;
    case 'delNo':confirmDel=false;fillDetail(false);break;
    case 'delYes':deletePoint();break;
    case 'expCsv':exportCsv();break;
    case 'expKml':exportKml();break;
    case 'clrCad':
      if(armed!=='cad'){armed='cad';t.textContent='再按一次確定清除';setTimeout(()=>{if(armed==='cad'){armed=null;t.textContent='清除本機地籍圖'}},4000)}
      else{armed=null;t.textContent='清除本機地籍圖';idb.del('cad');setCad(null);setImpMsg('已清除這支手機上的地籍圖。');renderLayers()}
      break;
    case 'clrKnown':
      if(armed!=='known'){armed='known';t.textContent='再按一次確定刪除（全組員都會消失）';setTimeout(()=>{if(armed==='known'){armed=null;t.textContent='刪除全部已知點'}},4000)}
      else{armed=null;t.textContent='刪除全部已知點';clearKnown()}
      break;
  }
});

$('#loginForm').addEventListener('submit',e=>{
  e.preventDefault();
  const n=$('#nameIn').value.trim(),c=cleanCode($('#codeIn').value);
  if(!n)return;
  if(c.length<6){toast('專案代碼至少 6 個英數字（可用 - 和 _）');return}
  const changed=c!==code;
  me=n;code=c;store.set('cp_name',me);store.set('cp_code',code);
  try{history.replaceState(null,'',location.pathname+'#'+code)}catch(err){}
  $('#login').hidden=true;setWho();
  if(changed||!unsubs.length)startSync();else draw();
});

/* ---------- sync ---------- */
function resetLocal(){
  unsubs.forEach(u=>u());unsubs=[];
  points.clear();known.clear();lines.clear();
  markers.forEach(m=>map.removeLayer(m));markers.clear();
  polys.forEach(p=>map.removeLayer(p));polys.clear();
  fitted=false;pending=false;syncErr=false;
  if(mode!=='idle')closeAll();
}
function startSync(){
  resetLocal();
  if(!cfgOk||!me||code.length<6){setStatus();return}
  const onErr=()=>{syncErr=true;setStatus();toast('無法讀取資料庫，請確認 Firestore 規則已貼上並發布')};
  unsubs.push(onSnapshot(colRef('points'),{includeMetadataChanges:true},snap=>{
    syncErr=false;pending=snap.metadata.hasPendingWrites;
    points.clear();
    snap.docs.forEach(d=>{const v=d.data();if(v&&typeof v.lat==='number'&&typeof v.lng==='number')points.set(d.id,Object.assign({id:d.id},v))});
    if(!fitted&&points.size){fitted=true;map.fitBounds(L.latLngBounds([...points.values()].map(p=>[p.lat,p.lng])).pad(.3),{maxZoom:19})}
    draw();
  },onErr));
  unsubs.push(onSnapshot(colRef('known'),snap=>{
    known.clear();
    snap.docs.forEach(d=>{const v=d.data();if(v&&typeof v.lat==='number'&&typeof v.lng==='number')known.set(d.id,Object.assign({id:d.id},v))});
    draw();
  },onErr));
  unsubs.push(onSnapshot(colRef('lines'),snap=>{
    lines.clear();
    snap.docs.forEach(d=>{const v=d.data();if(v&&v.a&&v.b)lines.set(d.id,{a:v.a,b:v.b})});
    draw();
  },onErr));
  setStatus();
}
setWho();
setStatus();
loadCad();
if(!cfgOk)showInfo('尚未設定資料庫','<p class="hint">網頁裡的 Firebase 設定還沒填入。完成設定後，這個畫面就會消失。</p>');
else if(!me||code.length<6)askLogin();
else startSync();
</script>
